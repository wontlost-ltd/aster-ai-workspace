server:
  port: 8080
  forward-headers-strategy: framework
spring:
  datasource:
    url: ${AIW_DB_URL:jdbc:postgresql://localhost:5432/aster_cloud?currentSchema=ai_workspace}
    username: ${AIW_DB_USERNAME:aster_ai_user}
    password: ${AIW_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  # 只建本服务自有的表；Pro 模块的表由其自身 initializeSchema 创建，两者互不干扰
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-aiw.sql
agui:
  path: /agui
  timeout: 10m
  pro:
    license: ${AGUI_PRO_LICENSE:}
  ee:
    governance:
      retention:
        conversations-days: ${AIW_RETENTION_DAYS:180}
        audit-days: ${AIW_RETENTION_DAYS:180}
    # 由 GovernanceConfig / ObservabilityConfig 按授权闸门接管，避免 Pro 自动配置在未授权时触达 License.require
    observability:
      enabled: false
aiw:
  cloud-url: ${AIW_CLOUD_URL:https://aster-lang.cloud}
  cloud-origin: ${AIW_CLOUD_ORIGIN:https://aster-lang.cloud}
  hmac-key: ${AIW_HMAC_KEY:}
  handoff-public-key: ${AIW_HANDOFF_PUBLIC_KEY:}
  ticket-key: ${AIW_TICKET_KEY:}
  # cloud → 本服务 GDPR 导出 / 清除调用的 HMAC 密钥，与 cloud 的 AI_WORKSPACE_GDPR_HMAC_KEY 相同；未设置时两个端点返回 503
  gdpr-hmac-key: ${AIW_GDPR_HMAC_KEY:}
  retention-days: ${AIW_RETENTION_DAYS:180}
  retention:
    cron: "0 17 3 * * *"
management:
  endpoints.web.exposure.include: health,prometheus
  endpoint.health.probes.enabled: true
vaadin:
  launch-browser: false
  allowed-packages: com.vaadin,org.vaadin,com.wontlost
