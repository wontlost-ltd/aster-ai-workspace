# AI 工作台错误文案（印地文，天城文）；配额/封禁/provider 文案与 aster-cloud ai.error* 一致
network=AI सेवा अस्थायी रूप से अनुपलब्ध है। कृपया बाद में पुनः प्रयास करें।
session_expired=आपका AI वर्कस्पेस सत्र समाप्त हो गया है। कृपया पेज को फिर से लोड करें।
source_too_large=पॉलिसी स्रोत या संदेश AI सहायक के लिए बहुत बड़ा है। कृपया इसे छोटा करके पुनः प्रयास करें।
ai_quota_exhausted=इस महीने का AI कोटा समाप्त हो गया है। यह अगले महीने की शुरुआत में रीसेट होगा, या अधिक के लिए अपना प्लान अपग्रेड करें।
ai_email_unverified=AI सुविधाएँ अनलॉक करने के लिए अपना ईमेल सत्यापित करें।
ai_rate_limited=बहुत अधिक अनुरोध। कृपया थोड़ी देर प्रतीक्षा करके पुनः प्रयास करें।
ai_banned=इस खाते के लिए AI सुविधाएँ बंद हैं। यदि आपको लगता है कि यह गलती है तो support@aster-lang.cloud से संपर्क करें।
byok_unavailable=अभी आपकी अपनी API कुंजी उपयोग नहीं की जा सकी। कृपया बाद में पुनः प्रयास करें।
unauthorized=आपका सत्र समाप्त हो गया है। कृपया पुनः साइन इन करें।
cloud_misconfigured=इस सर्वर पर AI कॉन्फ़िगर नहीं है। कृपया अपने प्रशासक से संपर्क करें।
provider_auth_failed=AI प्रदाता ने आपकी API कुंजी अस्वीकार कर दी (अमान्य, रद्द या अनुमति के बिना)। कृपया सेटिंग्स में कुंजी जाँचें।
provider_rejected_model=AI प्रदाता ने कॉन्फ़िगर किए गए मॉडल के लिए अनुरोध स्वीकार नहीं किया। मॉडल का नाम जाँचें और यह भी कि आपकी कुंजी उसका उपयोग कर सकती है।
provider_bad_request=AI प्रदाता ने अनुरोध अस्वीकार कर दिया। यह आमतौर पर कुंजी या खाते की सेटअप समस्या होती है, जैसे ऐसी कुंजी जो किसी workspace तक सीमित नहीं है।
provider_rate_limited=AI प्रदाता अनुरोधों को सीमित कर रहा है। कृपया थोड़ी देर प्रतीक्षा करें और फिर प्रयास करें।
provider_unavailable=AI प्रदाता अस्थायी रूप से अनुपलब्ध है। कृपया बाद में पुनः प्रयास करें।
out_of_scope=यह अनुरोध Aster AI सहायक के दायरे से बाहर है।
unknown=AI सेवा अस्थायी रूप से अनुपलब्ध
