# AI 工作台错误文案（简体中文）；配额/封禁/provider 文案与 aster-cloud ai.error* 一致
network=AI 服务暂时不可用，请稍后重试。
session_expired=AI 工作台会话已过期，请刷新页面。
source_too_large=策略源码或消息过长，超出 AI 助手的处理上限，请精简后重试。
ai_quota_exhausted=本月 AI 额度已用完，下月初重置；也可升级套餐获得更多额度。
ai_email_unverified=请先验证邮箱以解锁 AI 功能。
ai_rate_limited=请求过于频繁，请稍候再试。
ai_banned=该账号的 AI 功能已被停用。如有疑问请联系 support@aster-lang.cloud。
byok_unavailable=当前无法使用你自己的 API Key，请稍后再试。
unauthorized=登录状态已过期，请重新登录。
cloud_misconfigured=本服务器未配置 AI 功能，请联系管理员。
provider_auth_failed=AI 服务商拒绝了你的 API 密钥（无效、已撤销或无权限）。请到设置中检查该密钥。
provider_rejected_model=AI 服务商未接受针对所配置模型的请求。请检查模型名称，以及你的密钥是否有权使用该模型。
provider_bad_request=AI 服务商拒绝了该请求。通常是密钥或账号配置问题，例如密钥没有限定到某个 workspace。
provider_rate_limited=AI 服务商正在限流，请稍等片刻后重试。
provider_unavailable=AI 服务商暂时不可用，请稍后重试。
out_of_scope=该请求超出了 Aster AI 助手的服务范围。
unknown=AI 服务暂时不可用
