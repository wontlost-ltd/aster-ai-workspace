# AI 工作台错误文案（德文）；配额/封禁/provider 文案与 aster-cloud ai.error* 一致
network=KI-Dienst vorübergehend nicht verfügbar. Bitte versuchen Sie es später erneut.
session_expired=Ihre Sitzung im KI-Arbeitsbereich ist abgelaufen. Bitte laden Sie die Seite neu.
source_too_large=Der Richtlinien-Quelltext oder die Nachricht ist für den KI-Assistenten zu groß. Bitte kürzen Sie ihn und versuchen Sie es erneut.
ai_quota_exhausted=Ihr KI-Kontingent für diesen Monat ist aufgebraucht. Es wird zu Monatsbeginn zurückgesetzt – oder wählen Sie einen höheren Tarif.
ai_email_unverified=Bestätigen Sie Ihre E-Mail-Adresse, um KI-Funktionen freizuschalten.
ai_rate_limited=Zu viele Anfragen. Bitte warten Sie einen Moment und versuchen Sie es erneut.
ai_banned=KI-Funktionen sind für dieses Konto deaktiviert. Bei Fragen wenden Sie sich an support@aster-lang.cloud.
byok_unavailable=Ihr eigener API-Schlüssel kann derzeit nicht verwendet werden. Bitte später erneut versuchen.
unauthorized=Ihre Sitzung ist abgelaufen. Bitte melden Sie sich erneut an.
cloud_misconfigured=KI ist auf diesem Server nicht konfiguriert. Bitte wenden Sie sich an Ihren Administrator.
provider_auth_failed=Der KI-Anbieter hat Ihren API-Schlüssel abgelehnt (ungültig, widerrufen oder ohne Berechtigung). Prüfen Sie den Schlüssel in den Einstellungen.
provider_rejected_model=Der KI-Anbieter hat die Anfrage für das konfigurierte Modell nicht akzeptiert. Prüfen Sie den Modellnamen und ob Ihr Schlüssel es verwenden darf.
provider_bad_request=Der KI-Anbieter hat die Anfrage abgelehnt. Meist liegt ein Problem mit Schlüssel oder Konto vor, z. B. ein Schlüssel ohne Workspace-Zuordnung.
provider_rate_limited=Der KI-Anbieter begrenzt die Anfragen. Bitte warten Sie einen Moment und versuchen Sie es erneut.
provider_unavailable=Der KI-Anbieter ist vorübergehend nicht verfügbar. Bitte versuchen Sie es später erneut.
out_of_scope=Diese Anfrage liegt außerhalb dessen, wobei der Aster-KI-Assistent helfen kann.
unknown=KI-Dienst vorübergehend nicht verfügbar
