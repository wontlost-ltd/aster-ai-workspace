# AI 工作台错误文案（英文）；配额/封禁/provider 文案与 aster-cloud ai.error* 一致
network=AI service temporarily unavailable. Please try again later.
session_expired=Your AI workspace session has expired. Please reload the page.
source_too_large=The policy source or message is too large for the AI assistant. Please shorten it and try again.
ai_quota_exhausted=You have used up this month’s AI quota. It resets at the start of next month, or upgrade your plan for more.
ai_email_unverified=Verify your email to unlock AI features.
ai_rate_limited=Too many requests. Please wait a moment and try again.
ai_banned=AI features are disabled for this account. Contact support@aster-lang.cloud if you believe this is a mistake.
byok_unavailable=Your own API key could not be used right now. Please try again later.
unauthorized=Your session has expired. Please sign in again.
cloud_misconfigured=AI is not configured on this server. Please contact your administrator.
provider_auth_failed=The AI provider rejected your API key (invalid, revoked or without permission). Check the key in Settings.
provider_rejected_model=The AI provider did not accept the request for the configured model. Check the model name and that your key may use it.
provider_bad_request=The AI provider rejected the request. This is usually a key or account setup issue, such as a key that is not scoped to a workspace.
provider_rate_limited=The AI provider is rate limiting requests. Please wait a moment and try again.
provider_unavailable=The AI provider is temporarily unavailable. Please try again later.
out_of_scope=This request is outside what the Aster AI assistant can help with.
unknown=AI service temporarily unavailable
